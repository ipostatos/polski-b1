  <rect x="150" y="406" width="22" height="150" fill="#A8875A"/>
  <rect x="628" y="406" width="22" height="150" fill="#A8875A"/>
  <!-- ноутбуки и блокнот -->
  <g>
    <rect x="200" y="352" width="86" height="10" rx="3" fill="#5B6B7E"/>
    <path d="M212 352 l10 -34 h56 l10 34 z" fill="#7C8BA0"/>
    <rect x="470" y="352" width="86" height="10" rx="3" fill="#5B6B7E"/>
    <path d="M482 352 l10 -34 h56 l10 34 z" fill="#7C8BA0"/>
    <rect x="330" y="356" width="64" height="10" rx="3" fill="#E7E2D2"/>
    <rect x="596" y="356" width="14" height="34" rx="6" fill="#C7495B" transform="rotate(30 596 356)"/>
  </g>
  <!-- человек 1: старший, седой -->
  <circle cx="180" cy="256" r="27" fill="#E8C49C"/>
  <path d="M156 246 a27 27 0 0 1 48 -6 z" fill="#C9CBCF"/>
  <rect x="150" y="286" width="60" height="96" rx="24" fill="#5B7089"/>
