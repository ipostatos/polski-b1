  </g>
  <rect x="80" y="70" width="280" height="200" rx="10" fill="none" stroke="#B9AE99" stroke-width="8"/>
  <!-- растение -->
  <rect x="676" y="330" width="52" height="52" rx="8" fill="#A8763E"/>
  <g fill="#4E7D5B">
