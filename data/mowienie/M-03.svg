    <ellipse cx="676" cy="304" rx="14" ry="34" transform="rotate(-24 676 304)"/>
    <ellipse cx="728" cy="304" rx="14" ry="34" transform="rotate(24 728 304)"/>
  </g>
  <!-- стол -->
