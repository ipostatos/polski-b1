<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Ludzie w różnym wieku pracują razem przy jednym stole">
  <!-- Zadanie 1 · M-03: coworking, wspólna praca przy jednym stole -->
  <rect width="800" height="600" fill="#EDEAE2"/>
  <rect y="460" width="800" height="140" fill="#CBC2B0"/>
