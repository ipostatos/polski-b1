<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">Polski B1</title>
  <desc id="desc">Подготовка к государственному экзамену по польскому языку как иностранному, уровень B1. Экзамен 17.10.2026, пять модулей, порог 50% в каждом. Справа — экзаменационный бланк ответов: отмеченные варианты, цели по пяти модулям и штамп даты.</desc>

  <rect width="1200" height="340" rx="24" fill="#0E1116"/>

  <g id="title-block" transform="translate(64 60)">
    <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="17" letter-spacing="2.5" fill="#8B93A1">PAŃSTWOWY EGZAMIN CERTYFIKATOWY · POZIOM B1</text>

    <text x="0" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="64" font-weight="800" fill="#EDEFF3">Polski <tspan fill="#E0314B">B1</tspan></text>

    <path d="M2 92 C 60 98, 150 96, 232 92" stroke="#E0314B" stroke-width="4"
          fill="none" stroke-linecap="round"/>

    <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" fill="#C7CCD6">Система подготовки, построенная на машинном разборе</text>
    <text x="0" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="22" fill="#C7CCD6">всех 15 официальных сессий экзамена 2021–2024.</text>

    <text x="0" y="222" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="18" fill="#8B93A1">17.10.2026 · 190 minut · 5 modułów · próg 50% w każdym</text>
  </g>

  <g id="project-proof" transform="translate(732 38) rotate(1.4)">
    <rect width="404" height="264" rx="10" fill="#F4EFE6" stroke="#D8D2C4"/>

    <g transform="translate(28 34)">
      <text x="0" y="0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="15" letter-spacing="1.5" fill="#6A6456">KARTA ODPOWIEDZI · B1</text>

      <!-- две строки ответов a/b/c, отмечено по одному варианту -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#6A6456">
        <g transform="translate(0 18)">
          <text x="0" y="16">1.</text>
          <rect x="28" y="0" width="22" height="22" rx="4" fill="none" stroke="#B9B2A2"/>
          <text x="35" y="16">a</text>
          <rect x="60" y="0" width="22" height="22" rx="4" fill="#E0314B" stroke="#E0314B"/>
          <text x="67" y="16" fill="#F4EFE6" font-weight="700">b</text>
          <rect x="92" y="0" width="22" height="22" rx="4" fill="none" stroke="#B9B2A2"/>
          <text x="99" y="16">c</text>
        </g>
        <g transform="translate(180 18)">
          <text x="0" y="16">2.</text>
          <rect x="28" y="0" width="22" height="22" rx="4" fill="none" stroke="#B9B2A2"/>
          <text x="35" y="16">a</text>
          <rect x="60" y="0" width="22" height="22" rx="4" fill="none" stroke="#B9B2A2"/>
          <text x="67" y="16">b</text>
          <rect x="92" y="0" width="22" height="22" rx="4" fill="#E0314B" stroke="#E0314B"/>
          <text x="99" y="16" fill="#F4EFE6" font-weight="700">c</text>
        </g>
      </g>

      <line x1="0" y1="62" x2="348" y2="62" stroke="#D8D2C4"/>

      <!-- пять модулей: заполнение до цели, красная риска = порог 50% -->
      <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#6A6456">
        <g transform="translate(0 80)">
          <text x="0" y="11">SŁ</text>
          <rect x="34" y="2" width="250" height="10" rx="5" fill="#E4DFD2"/>
          <rect x="34" y="2" width="183" height="10" rx="5" fill="#2E3440"/>
          <rect x="158" y="-1" width="2.5" height="16" fill="#E0314B"/>
          <text x="292" y="12">22/30</text>
        </g>
        <g transform="translate(0 106)">
          <text x="0" y="11">CZ</text>
          <rect x="34" y="2" width="250" height="10" rx="5" fill="#E4DFD2"/>
          <rect x="34" y="2" width="192" height="10" rx="5" fill="#2E3440"/>
          <rect x="158" y="-1" width="2.5" height="16" fill="#E0314B"/>
          <text x="292" y="12">23/30</text>
        </g>
        <g transform="translate(0 132)">
          <text x="0" y="11">GR</text>
          <rect x="34" y="2" width="250" height="10" rx="5" fill="#E4DFD2"/>
          <rect x="34" y="2" width="183" height="10" rx="5" fill="#2E3440"/>
          <rect x="158" y="-1" width="2.5" height="16" fill="#E0314B"/>
          <text x="292" y="12">22/30</text>
        </g>
        <g transform="translate(0 158)">
          <text x="0" y="11">PI</text>
          <rect x="34" y="2" width="250" height="10" rx="5" fill="#E4DFD2"/>
          <rect x="34" y="2" width="175" height="10" rx="5" fill="#2E3440"/>
          <rect x="158" y="-1" width="2.5" height="16" fill="#E0314B"/>
          <text x="292" y="12">21/30</text>
        </g>
        <g transform="translate(0 184)">
          <text x="0" y="11">MÓ</text>
          <rect x="34" y="2" width="250" height="10" rx="5" fill="#E4DFD2"/>
          <rect x="34" y="2" width="175" height="10" rx="5" fill="#2E3440"/>
          <rect x="158" y="-1" width="2.5" height="16" fill="#E0314B"/>
          <text x="292" y="12">28/40</text>
        </g>
      </g>
    </g>

    <!-- штамп даты экзамена -->
    <g transform="translate(268 -8) rotate(-7)">
      <rect width="126" height="42" rx="8" fill="none" stroke="#E0314B" stroke-width="2.5"/>
      <text x="63" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="17" font-weight="700" fill="#E0314B">17 X 2026</text>
    </g>
  </g>
</svg>
