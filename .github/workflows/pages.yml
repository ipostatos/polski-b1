name: Pages

# Mini App полностью статическая: webapp/ + data/*.json (+ data/audio).
# Деплоим весь репозиторий как есть — официальных материалов в нём нет
# (archive/ закрыт .gitignore, CI отдельно сторожит).
# URL Mini App: https://ipostatos.github.io/polski-b1/webapp/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
