name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt
          pip install pytest reportlab pymupdf

      - name: Тесты бота и содержания
        run: python -m pytest bot/test_bot.py bot/test_dashboard.py -q

      - name: Рабочая тетрадь собирается и читается
        run: |
          python workbook/build_workbook.py
          python tools/check_pdf.py

      - name: В репозитории нет экзаменационных материалов
        run: |
          if git ls-files | grep -iE '(arkusz|transkrypcja|dzwiekowy)|\.mp3$' | grep -v '^data/audio/'; then
            echo "Официальные материалы не должны попадать в репозиторий"
            exit 1
          fi

      - name: Нет следов чужих проектов
        run: |
          # содержимое репозитория — только про экзамен B1; -I: бинарники
          # (mp3, pdf) не смотрим — случайные байты дают ложные срабатывания
          if git grep -InE '\b(jacht|skipper|żegl[a-ząęółśćżźń]*|rejs|marina|VHF|ISSA)\b' -- . ':!.github/workflows/ci.yml'; then
            echo "Найдены посторонние слова из других проектов"
            exit 1
          fi
